# Overlay for PostgreSQL integration tests.
# Exposes Postgres on loopback only; does not start backend/frontend/SRS.
#
# Usage:
#   ./deploy/scripts/run_postgres_tests.sh
# or manually:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres
#   export RESTREAM_TEST_DATABASE_URL=postgresql://restream:restream_test_password@127.0.0.1:5432/restream_test
#   pytest -q tests/test_migration_and_api.py -k Postgres

services:
  postgres:
    environment:
      POSTGRES_DB: restream_test
      POSTGRES_USER: restream
      POSTGRES_PASSWORD: restream_test_password
    ports:
      - "127.0.0.1:5432:5432"
    # Ephemeral volume for tests (do not reuse production postgres-data).
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restream -d restream_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Keep app services offline during DB integration tests.
  backend:
    profiles: ["disabled"]
  frontend:
    profiles: ["disabled"]
  srs:
    profiles: ["disabled"]

volumes:
  postgres-test-data:
