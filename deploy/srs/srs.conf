listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        # Token is injected from RESTREAM_SRS_WEBHOOK_SECRET at container/start time.
        on_publish      http://127.0.0.1:8000/on_publish?token=__UNRENDERED_SECRET__;
        on_unpublish    http://127.0.0.1:8000/on_unpublish?token=__UNRENDERED_SECRET__;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;
        hls_window      30;
        hls_cleanup     on;
    }
}
