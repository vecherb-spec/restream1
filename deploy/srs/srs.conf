listen              1935;
max_connections     1000;
daemon              off;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        # Add the same token as RESTREAM_SRS_WEBHOOK_SECRET in backend .env
        on_publish      http://backend:8000/on_publish?token=change_me_srs_webhook_secret;
        on_unpublish    http://backend:8000/on_unpublish?token=change_me_srs_webhook_secret;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;
        hls_window      30;
        hls_cleanup     on;
    }
}
